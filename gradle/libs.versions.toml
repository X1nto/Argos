[versions]
agp = "8.12.2"
kotlin = "2.2.10"
compose = "1.9.0"
ktor = "3.2.3"
coil = "2.7.0"
paging = "3.3.6"
skie = "0.10.6"
koin = "4.1.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core-ktx", version = "1.17.0"}
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
androidx-browser = { module = "androidx.browser:browser", version = "1.9.0" }
androidx-crypto = { group = "androidx.security", name = "security-crypto", version = "1.1.0" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.8.7" }

desugaring = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }

paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.5.0-alpha03" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version = "0.7.1" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version = "1.9.0" }

ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-auth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktor" }
ktor-serialization = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }

koin-core = { group = "io.insert-koin", name = "koin-core", version = "4.1.1" }
koin-android = { group = "io.insert-koin", name = "koin-android", version = "4.1.1" }
koin-android-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version = "4.1.1" }

appauth = { group = "net.openid", name = "appauth", version = "0.11.1" }

navigationReimagined = { group = "dev.olshevski.navigation", name = "reimagined", version = "1.5.0" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }

jsoup = { group = "org.jsoup", name = "jsoup", version = "1.21.2"}

skie-annotations = { group = "co.touchlab.skie", name = "configuration-annotations", version.ref="skie" }

[bundles]
ktor = ["ktor-core", "ktor-auth", "ktor-serialization", "ktor-serialization-json"]
coil = ["coil-compose", "coil-svg"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
skie = { id = "co.touchlab.skie", version.ref="skie" }
ksp = { id = "com.google.devtools.ksp", version = "2.2.10-2.0.2" }